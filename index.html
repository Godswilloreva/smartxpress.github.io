<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartXpress | Global Logistics Command</title>
    <style>
        /* 1. GLOBAL SETTINGS - BRIGHT & SOLID */
        :root {
            --primary: #002d5b; /* Solid Navy */
            --accent: #00d4ff; /* Electric Blue */
            --bg-light: #f4f7f9; /* Clean White-Grey */
            --surface: #ffffff; /* Pure White */
            --text-main: #1a2233;
            --success: #00a859; /* Solid Green */
        }

        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-light); color: var(--text-main); overflow-x: hidden;
        }

        /* 2. CINEMATIC VIDEO HEADER */
        .hero-header {
            position: relative;
            width: 100%;
            height: 70vh;
            background: var(--primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 5px solid var(--accent);
        }

        .header-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.4;
            object-fit: cover;
        }

        .nav-glass {
            position: absolute;
            top: 0; width: 100%; padding: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            z-index: 20; display: flex; justify-content: space-around; align-items: center;
        }

        /* BLINKING GREEN INDICATOR CSS */
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px #00ff00;
            animation: blinker 1.5s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .header-overlay { position: relative; z-index: 10; text-align: center; width: 90%; }

        .fade-text {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            opacity: 0;
            animation: textSequence 8s infinite;
        }

        @keyframes textSequence {
            0%, 10% { opacity: 0; transform: translateY(10px); }
            20%, 80% { opacity: 1; transform: translateY(0); }
            90%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* 3. TRACKING BAR - SOLID NAVY */
        .track-bar {
            background: var(--primary);
            padding: 40px 5%;
            display: flex;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,45,91,0.2);
            position: relative;
            z-index: 30;
        }
        .track-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 0;
        }
        .track-container input {
            flex: 2; padding: 20px; background: #fff; border: none;
            color: #000; border-radius: 8px 0 0 8px; font-weight: bold; font-size: 16px; outline: none;
        }
        .track-container button {
            flex: 1; background: var(--accent); color: #000; border: none;
            font-weight: 900; border-radius: 0 8px 8px 0; cursor: pointer; text-transform: uppercase;
            transition: 0.3s;
        }
        .track-container button:hover { background: #fff; color: var(--primary); }

        /* 4. GLOBAL LIVE LOG - CLEAN WHITE CARD */
        .activity-section { padding: 50px 5%; }
        .activity-section h3 { color: var(--primary); font-weight: 900; text-transform: uppercase; margin-bottom: 20px; }
        
        .log-container { 
            width: 100%; 
            background: var(--surface); 
            border-radius: 12px; 
            border: none; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 18px; background: #f8fafc; color: var(--primary); font-size: 12px; text-transform: uppercase; border-bottom: 2px solid #edf2f7; }
        td { padding: 18px; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; font-weight: 500; }

        .tag { padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; }
        .tag-success { color: var(--success); background: rgba(0,168,89,0.1); border: 1px solid var(--success); }
        .tag-transit { color: var(--primary); background: rgba(0,45,91,0.05); border: 1px solid var(--primary); }

        /* 6. CHAT HUB */
        .chat-hub-wrapper {
            position: fixed; bottom: 30px; right: 30px; z-index: 10000;
            display: flex; flex-direction: column-reverse; align-items: center; gap: 15px;
        }
        .main-trigger-btn {
            width: 65px; height: 65px; background: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,45,91,0.3); cursor: pointer; border: none; transition: 0.3s;
        }
        .main-trigger-btn svg { width: 30px; height: 30px; fill: #fff; }
        .chat-stack { display: none; flex-direction: column; gap: 15px; margin-bottom: 5px; }
        .stack-active { display: flex; animation: popUp 0.4s forwards; }
        @keyframes popUp { 0% { opacity: 0; transform: translateY(30px) scale(0.5); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .chat-opt { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; background: #fff; }
        .wa-btn { background: #25D366; }
        .chat-opt img { width: 28px; height: 28px; }

        @media (max-width: 768px) {
            .track-container { flex-direction: column; }
            .track-container input { border-radius: 8px; margin-bottom: 10px; }
            .track-container button { border-radius: 8px; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- VIDEO HEADER -->
    <header class="hero-header">
        <div class="nav-glass">
            <div style="font-weight:900; color:#fff; letter-spacing:2px; font-size: 20px;">SMART<span style="color:var(--accent)">XPRESS</span></div>
            <div style="color:#fff; font-size:10px; border:1px solid #fff; padding:5px 12px; border-radius:20px; font-weight: bold;">
                <span class="status-dot"></span> SYSTEM LIVE
            </div>
        </div>
        <video class="header-video" autoplay muted loop playsinline>
            <source src="v.mp4" type="video/mp4">
        </video>
        <div class="header-overlay">
            <div class="fade-text" id="rotateMsg">GLOBAL FREIGHT COMMAND</div>
        </div>
    </header>

    <!-- TRACKING BAR -->
    <section class="track-bar">
        <div class="track-container">
            <input type="text" id="trackInput" placeholder="Enter Airway Bill or Tracking ID">
            <button onclick="handleTrack()">Track Shipment</button>
        </div>
    </section>

    <!-- LIVE LOG -->
    <section class="activity-section">
        <h3>Live Operations Feed</h3>
        <div class="log-container">
            <table>
                <thead>
                    <tr>
                        <th>Reference ID</th>
                        <th>Client</th>
                        <th>Route</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="logRows"></tbody>
            </table>
        </div>
    </section>

    <!-- CHAT HUB -->
    <div class="chat-hub-wrapper">
        <button class="main-trigger-btn" id="hubBtn" onclick="toggleHub()">
            <svg id="msgIcon" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
            </svg>
        </button>
        <div class="chat-stack" id="hubStack">
            <a href="https://wa.me/529531960361" target="_blank" class="chat-opt wa-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA"></a>
            <a href="chat.html" class="chat-opt live-btn"><img src="https://cdn-icons-png.flaticon.com/512/2040/2040946.png" alt="Chat"></a>
        </div>
    </div>

    <script>
        const clients = ["Global Logistics", "Apex Freight", "Trans-Atlantic", "Nexus Supply", "Prime Shipping"];
        const destinations = ["London, UK", "New York, USA", "Tokyo, Japan", "Dubai, UAE", "Paris, France"];
        const statuses = ["IN TRANSIT", "PROCESSING", "ARRIVED", "DELIVERED"];
        const updates = ["Departed Hub", "Customs Clearing", "On-Flight", "Sorting Facility"];

        const logEl = document.getElementById('logRows');
        const msgEl = document.getElementById('rotateMsg');
        const messages = ["GLOBAL FREIGHT COMMAND", "SECURE AIR & SEA CARGO", "REAL-TIME SATELLITE TRACKING"];
        let msgIdx = 0;

        function tickLiveOperations() {
            logEl.innerHTML = "";
            for (let i = 0; i < 5; i++) {
                const idNum = Math.floor(1000 + Math.random() * 9000);
                const s = {
                    id: `XP-${idNum}-INT`,
                    name: clients[Math.floor(Math.random() * clients.length)],
                    dest: destinations[Math.floor(Math.random() * destinations.length)],
                    status: statuses[Math.floor(Math.random() * statuses.length)],
                    note: updates[Math.floor(Math.random() * updates.length)]
                };
                const isDone = (s.status === "DELIVERED" || s.status === "ARRIVED");
                logEl.innerHTML += `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.dest}</td><td><span class="tag ${isDone ? 'tag-success' : 'tag-transit'}">${s.status}</span></td></tr>`;
            }
        }

        setInterval(() => {
            msgIdx = (msgIdx + 1) % messages.length;
            msgEl.textContent = messages[msgIdx];
        }, 8000);

        function handleTrack() {
            const val = document.getElementById('trackInput').value;
            if(val) { window.location.href = "track.html?id=" + val; }
        }

        function toggleHub() {
            document.getElementById('hubStack').classList.toggle('stack-active');
        }

        tickLiveOperations();
        setInterval(tickLiveOperations, 3000);
    </script>
</body>
</html>
