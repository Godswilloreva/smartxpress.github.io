<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartXpress | Support Center</title>
    <style>
        :root { --primary: #002d5b; --accent: #00d4ff; --bot-msg: #eef2f5; --user-msg: #002d5b; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }

        /* Top Bar */
        .top-bar { background: var(--primary); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        
        /* Chat Container */
        .chat-wrapper { max-width: 500px; margin: 20px auto; background: white; height: 80vh; display: flex; flex-direction: column; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }

        /* Message Area */
        #chat-display { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .bot { background: var(--bot-msg); color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: var(--user-msg); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }

        /* Input Area */
        .input-area { padding: 15px; border-top: 1px solid #eee; background: white; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        /* Hidden Form (The Manual Route Bridge) */
        #hidden-form { display: none; }
    </style>
</head>
<body>

<div class="top-bar">
    <strong>SmartXpress 24/7 Support</strong>
    <a href="index.html" style="color:white; text-decoration:none; font-size:12px; border:1px solid white; padding:5px 10px; border-radius:4px;">Exit</a>
</div>

<div class="chat-wrapper">
    <div id="chat-display">
        <div class="msg bot">Hello! I am the SmartXpress AI. How can I help you today? <br><br>You can ask about: <b>Tracking</b>, <b>Pricing</b>, or <b>Contact</b>.</div>
    </div>

    <!-- This is where the user types -->
    <div class="input-area">
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button onclick="handleChat()">Send</button>
        </div>
    </div>
</div>

<!-- FORMSPREE BRIDGE: Put your ID in the action -->
<form id="hidden-form" action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
    <input type="hidden" name="client_message" id="form-msg">
</form>

<script>
    const chatDisplay = document.getElementById('chat-display');
    const userInput = document.getElementById('user-input');
    const hiddenForm = document.getElementById('hidden-form');
    const formInput = document.getElementById('form-msg');

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.classList.add('msg', sender);
        div.innerHTML = text;
        chatDisplay.appendChild(div);
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    function handleChat() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';

        // ROBOT LOGIC
        setTimeout(() => {
            const lowerText = text.toLowerCase();
            
            if (lowerText.includes("hello") || lowerText.includes("hi")) {
                addMessage("Hi there! Welcome to SmartXpress. How can I assist with your shipment?", 'bot');
            } 
            else if (lowerText.includes("track") || lowerText.includes("where")) {
                addMessage("To track a parcel, please go to the <b>Tracking Page</b> on our home menu and enter your ID.", 'bot');
            }
            else if (lowerText.includes("price") || lowerText.includes("cost") || lowerText.includes("how much")) {
                addMessage("Shipping rates depend on weight and destination. Our standard international rate starts at $15 per kg.", 'bot');
            }
            else {
                // If the robot doesn't know, it sends the message to YOUR EMAIL
                addMessage("I'm not sure about that. I am sending your message to our human manager right now. They will reply to you via email soon!", 'bot');
                
                // Trigger the Manual Route (Formspree)
                formInput.value = text;
                hiddenForm.submit();
            }
        }, 800);
    }

    // Allow "Enter" key to send
    userInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            handleChat();
        }
    });
</script>

</body>
</html>
